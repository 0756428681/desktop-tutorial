<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - RRubaa's Shop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5}
.header{
    background:#fff;padding:15px 6%;display:flex;justify-content:space-between;box-shadow:0 2px 5px rgba(0,0,0,.1)
}
.logo{
    font-weight:900;font-size:22px;text-decoration:none;color:#111}.logo span{color:#ff3e6c
    }
.container{
    display:flex;flex-wrap:wrap;gap:20px;padding:20px 6%
}
.left{
    flex:2;min-width:300px;background:#fff;padding:20px;border-radius:10px
}
.right{
    flex:1;min-width:280px;background:#fff;padding:20px;border-radius:10px;height:fit-content
}
h2{
    margin-bottom:15px;font-size:18px
}
input,select,textarea{width:100%;padding:11px;margin:7px 0 12px;border:1px solid #ccc;border-radius:6px}
.row{display:flex;gap:10px}
.btn{width:100%;padding:13px;background:#ff3e6c;color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px}
.btn:hover{background:#e6355e}
.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:14px}
.total{display:flex;justify-content:space-between;font-weight:900;font-size:18px;margin-top:15px}
.pay{margin-top:15px;font-size:13px}
.pay label{display:block;padding:8px;border:1px solid #ddd;border-radius:6px;margin:5px 0;cursor:pointer}
</style>
</head>
<body>
<div class="header">
  <a href="homepage.html" class="logo">Rubaa's<span>Shop</span></a>
  <a href="homepage.html">← Continue Shopping</a>
</div>

<div class="container">
  <div class="left">
    <h2>1. Delivery Information</h2>
    <div class="row"><input placeholder="First Name"><input placeholder="Last Name"></div>
    <input placeholder="Phone Number - 0772...">
    <input placeholder="Email Address">
    <textarea placeholder="Delivery Address - e.g., Makerere, Kampala"></textarea>
    <select><option>Kampala - Free Delivery</option><option>Wakiso - 10,000 UGX</option><option>Upcountry - 20,000 UGX</option></select>

    <h2 style="margin-top:20px">2. Payment Method</h2>
    <div class="pay">
      <label><input type="radio" name="pay" checked> Mobile Money (MTN / Airtel)</label>
      <label><input type="radio" name="pay"> Cash on Delivery</label>
      <label><input type="radio" name="pay"> Visa / Mastercard</label>
    </div>

    <button class="btn" onclick="placeOrder()">PLACE ORDER - Pay Now</button>
  </div>

  <div class="right">
    <h2>Order Summary</h2>
    <div id="cartItems">Loading...</div>
    <div class="total"><span>Total:</span><span id="total">0 UGX</span></div>
    <p style="font-size:12px;color:#888;margin-top:10px">Delivery fee included. You will receive SMS confirmation.</p>
  </div>
</div>

<script>
let cart = JSON.parse(localStorage.getItem('cart')||'[]');
let total = 0;
const div = document.getElementById('cartItems');
if(cart.length==0){
  div.innerHTML="<p>Your cart is empty. <a href='index.html'>Go shop</a></p>";
}else{
  div.innerHTML = cart.map((c,i)=>{total+=c.price; return `<div class="item"><span>${c.emoji} ${c.name}</span><span>${c.price.toLocaleString()}<br><a href="#" onclick="removeItem(${i})" style="color:red;font-size:11px">Remove</a></span></div>`}).join('');
}
document.getElementById('total').innerText = total.toLocaleString() + " UGX";

function removeItem(i){cart.splice(i,1);localStorage.setItem('cart',JSON.stringify(cart));location.reload();}
function placeOrder(){
  if(cart.length==0){alert("Cart empty!");return;}
  alert("Order Placed! Total: " + total.toLocaleString() + " UGX. You will get MTN Mobile Money prompt.");
  localStorage.removeItem('cart');
  location.href="index.html";
}
</script>
</body>
</html>
